# Builds the Windows installer and the two Mac apps (Apple Silicon and Intel) on every push
# to main, or from the Actions tab with "Run workflow". The files land on the Releases page
# under "newest", which anyone can download from without a GitHub account.
name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]

# Every build gets a higher version number, so the app's updater can tell it's newer.
env:
  APP_VERSION: 1.2.${{ github.run_number }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Set the version, and sign updates when the key is there
        shell: bash
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          node -e "const fs=require('fs');const f='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(f,'utf8'));c.version=process.env.APP_VERSION;if(process.env.HAS_KEY==='true')c.bundle.createUpdaterArtifacts=true;fs.writeFileSync(f,JSON.stringify(c,null,2))"
          echo "Version $APP_VERSION, signed updates: $HAS_KEY"
      - run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
          retention-days: 30

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build whisper-cli for both kinds of Mac
        run: |
          git clone --depth 1 --branch v1.8.2 https://github.com/ggml-org/whisper.cpp /tmp/whisper
          mkdir -p src-tauri/binaries
          for pair in "arm64 aarch64-apple-darwin" "x86_64 x86_64-apple-darwin"; do
            set -- $pair
            cmake -S /tmp/whisper -B /tmp/whisper/build-$1 -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=$1 \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DGGML_METAL=ON \
              -DGGML_METAL_EMBED_LIBRARY=ON -DWHISPER_BUILD_TESTS=OFF -DWHISPER_SDL2=OFF
            cmake --build /tmp/whisper/build-$1 --config Release -j 4 --target whisper-cli
            cp /tmp/whisper/build-$1/bin/whisper-cli src-tauri/binaries/whisper-cli-$2
          done
          chmod +x src-tauri/binaries/*
          file src-tauri/binaries/*
      - name: Set the version, and sign updates when the key is there
        shell: bash
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          node -e "const fs=require('fs');const f='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(f,'utf8'));c.version=process.env.APP_VERSION;if(process.env.HAS_KEY==='true')c.bundle.createUpdaterArtifacts=true;fs.writeFileSync(f,JSON.stringify(c,null,2))"
          echo "Version $APP_VERSION, signed updates: $HAS_KEY"
      - name: Build the Apple Silicon app
        run: npx tauri build --target aarch64-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
      - name: Build the Intel app
        run: npx tauri build --target x86_64-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/*/release/bundle/macos/*.app.tar.gz
            src-tauri/target/*/release/bundle/macos/*.app.tar.gz.sig
          retention-days: 30

  release:
    needs: [windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: built
      - name: Give the files plain names
        run: |
          mkdir out
          cp built/windows/*.exe out/Video-Downloader-Windows-Setup.exe
          cp built/mac/aarch64-apple-darwin/release/bundle/dmg/*.dmg out/Video-Downloader-Mac-Apple-Silicon.dmg
          cp built/mac/x86_64-apple-darwin/release/bundle/dmg/*.dmg out/Video-Downloader-Mac-Intel.dmg
          for a in aarch64:Apple-Silicon x86_64:Intel; do
            f=$(ls built/mac/${a%%:*}-apple-darwin/release/bundle/macos/*.app.tar.gz 2>/dev/null | head -1)
            if [ -n "$f" ]; then cp "$f" out/Video-Downloader-Mac-${a##*:}.app.tar.gz; fi
          done
          ls -la out
      - name: Write latest.json for the app's updater
        env:
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import glob, json, os, datetime
          base = f"https://github.com/{os.environ['REPO']}/releases/download/newest/"
          platforms = {}
          def add(key, sig_glob, asset):
              found = glob.glob(sig_glob)
              if found:
                  platforms[key] = {"signature": open(found[0]).read().strip(), "url": base + asset}
          add("windows-x86_64", "built/windows/*.exe.sig", "Video-Downloader-Windows-Setup.exe")
          add("darwin-aarch64", "built/mac/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig", "Video-Downloader-Mac-Apple-Silicon.app.tar.gz")
          add("darwin-x86_64", "built/mac/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig", "Video-Downloader-Mac-Intel.app.tar.gz")
          if platforms:
              json.dump({"version": os.environ["APP_VERSION"], "notes": "", "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"), "platforms": platforms}, open("out/latest.json", "w"), indent=1)
              print("latest.json for", ", ".join(platforms))
          else:
              print("No signed updates in this build, so no latest.json")
          PY
      - name: Replace the newest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete newest --cleanup-tag --yes || true
          gh release create newest out/* --target "$GITHUB_SHA" --title "Video Downloader (newest build)" --latest \
            --notes "Windows: download Video-Downloader-Windows-Setup.exe. Mac with an M chip: download Video-Downloader-Mac-Apple-Silicon.dmg. Older Intel Mac: download Video-Downloader-Mac-Intel.dmg."
